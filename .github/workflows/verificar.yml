name: verificar
on: { push: { branches: [ 'ci/verificar-fase-6' ] } }
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: [ '3306:3306' ]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - name: Compilar API
        run: dotnet build backend/src/LigaManager.API/LigaManager.API.csproj -c Release
      - name: Consultas contra MySQL
        run: |
          dotnet run --project ci/prueba/prueba.csproj -c Release > salida.txt 2>&1; codigo=$?
          grep -E "^OK|TODO OK|Exception" salida.txt | while read l; do echo "::notice::$l"; done
          exit $codigo
